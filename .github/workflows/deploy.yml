name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: waiyandev/ai-storybook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: REPO_URL
          script: |
            set -e
            PROJECT_DIR="$HOME/projects/ai-storybook"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              rm -rf "$PROJECT_DIR"
              git clone "$REPO_URL" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main

            cat > .env.docker <<'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}

            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}

            TTS_AZURE_KEY=${{ secrets.TTS_AZURE_KEY }}
            TTS_AZURE_REGION=${{ secrets.TTS_AZURE_REGION }}
            TTS_AZURE_ENDPOINT=${{ secrets.TTS_AZURE_ENDPOINT }}

            VOICE_LAB_WORKER_URL=${{ secrets.VOICE_LAB_WORKER_URL }}
            VOICE_LAB_WORKER_TOKEN=${{ secrets.VOICE_LAB_WORKER_TOKEN }}
            VOICE_CALLBACK_BASE_URL=${{ secrets.VOICE_CALLBACK_BASE_URL }}
            ASR_WORKER_URL=${{ secrets.ASR_WORKER_URL }}
            ASR_WORKER_TOKEN=${{ secrets.ASR_WORKER_TOKEN }}
            WHISPER_MM_WORKER_URL=${{ secrets.WHISPER_MM_WORKER_URL }}
            WHISPER_MM_WORKER_TOKEN=${{ secrets.WHISPER_MM_WORKER_TOKEN }}

            RECAP_JOB_RUNNER=${{ secrets.RECAP_JOB_RUNNER }}
            GITHUB_DISPATCH_TOKEN=${{ secrets.RECAP_DISPATCH_TOKEN }}
            GITHUB_DISPATCH_REPO=${{ github.repository }}
            ENVEOF

            docker compose pull ai-storybook-app-prod

            docker compose up -d ai-storybook-app-prod

            docker image prune -f
