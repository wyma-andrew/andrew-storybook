# Movie Recap narration (script) and render runs, dispatched by the app when
# RECAP_JOB_RUNNER=github — see lib/recap-job-dispatch.ts. The app has already
# claimed the project row; this job runs the pipeline and writes the result back.
name: Recap job

run-name: "recap ${{ inputs.kind }} · ${{ inputs.project_id }}"

on:
  workflow_dispatch:
    inputs:
      kind:
        description: script | render
        required: true
        type: choice
        options: [script, render]
      project_id:
        required: true
        type: string
      mock:
        type: string
        default: "false"
      revoice:
        description: Script only — re-speak the existing beats with the current voice
        type: string
        default: "false"
      episode_id:
        type: string
        default: ""
      previous:
        description: Pre-claim project run columns (JSON), episode runs only
        type: string
        default: ""

# One run per project at a time; the row claim already enforces this, so a
# second dispatch would only be a stray one.
concurrency:
  group: recap-${{ inputs.project_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      TTS_AZURE_KEY: ${{ secrets.TTS_AZURE_KEY }}
      TTS_AZURE_REGION: ${{ secrets.TTS_AZURE_REGION }}
      TTS_AZURE_ENDPOINT: ${{ secrets.TTS_AZURE_ENDPOINT }}
      VOICE_LAB_WORKER_URL: ${{ secrets.VOICE_LAB_WORKER_URL }}
      VOICE_LAB_WORKER_TOKEN: ${{ secrets.VOICE_LAB_WORKER_TOKEN }}
      # Same font setup as the Dockerfile: Ubuntu's ffmpeg carries libass,
      # harfbuzz and libopus; Medium/SemiBold Myanmar come from upstream.
      FFMPEG_PATH: ffmpeg
      MOVIE_RECAP_SUBTITLE_FONT: Noto Sans Myanmar
      MOVIE_RECAP_SUBTITLE_FONT_MEDIUM: Noto Sans Myanmar Medium
      MOVIE_RECAP_SUBTITLE_FONT_SEMIBOLD: Noto Sans Myanmar SemiBold
      NOTO_MYANMAR_VERSION: "2.107"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Before ffmpeg, so the "Mark row failed" step can still run tsx if the
      # apt install is what breaks.
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      # apt output goes to /dev/null; errors still reach stderr and fail the step.
      # Error-Mode=any: a DNS failure during update is only a warning by default,
      # and install then runs against stale indexes and can hang for hours.
      # See history/movie-recap.md 2026-11-12.
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo apt-get update -qq $APT_OPTS -o APT::Update::Error-Mode=any > /dev/null &&
               sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -qq --no-install-recommends \
                 $APT_OPTS -o Dpkg::Use-Pty=0 ffmpeg fonts-noto-core fontconfig > /dev/null; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep $((attempt * 15))
          done
          exit 1

      - name: Install Myanmar fonts
        run: |
          curl -fsSL -o /tmp/noto.zip "https://github.com/notofonts/myanmar/releases/download/NotoSansMyanmar-v${NOTO_MYANMAR_VERSION}/NotoSansMyanmar-v${NOTO_MYANMAR_VERSION}.zip"
          python3 -m zipfile -e /tmp/noto.zip /tmp/noto
          sudo mkdir -p /usr/share/fonts/truetype/noto-myanmar
          sudo cp /tmp/noto/NotoSansMyanmar/hinted/ttf/NotoSansMyanmar-Medium.ttf \
                  /tmp/noto/NotoSansMyanmar/hinted/ttf/NotoSansMyanmar-SemiBold.ttf \
                  /usr/share/fonts/truetype/noto-myanmar/
          sudo fc-cache -f

      - name: Check ffmpeg filters and encoders
        run: |
          ffmpeg -hide_banner -filters | grep -E ' (subtitles|ass|drawtext) '
          ffmpeg -hide_banner -encoders | grep libopus

      - name: Run script job
        if: inputs.kind == 'script'
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          REVOICE: ${{ inputs.revoice }}
          EPISODE_ID: ${{ inputs.episode_id }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          set -- script "$PROJECT_ID"
          [ "$REVOICE" = "true" ] && set -- "$@" --revoice
          [ -n "$EPISODE_ID" ] && set -- "$@" --episode "$EPISODE_ID" "$PREVIOUS"
          npx tsx scripts/recap-job.ts "$@"

      - name: Run render job
        if: inputs.kind == 'render'
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          MOCK: ${{ inputs.mock }}
          EPISODE_ID: ${{ inputs.episode_id }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          set -- render "$PROJECT_ID"
          [ "$MOCK" = "true" ] && set -- "$@" --mock
          [ -n "$EPISODE_ID" ] && set -- "$@" --episode "$EPISODE_ID" "$PREVIOUS"
          npx tsx scripts/recap-job.ts "$@"

      # A killed runner (timeout, cancelled from the Actions tab) never reaches
      # the pipeline's own catch; without this the row stays "running" forever.
      # Every update is guarded on the row still being "running", so a run that
      # already wrote its own failure is left alone.
      - name: Mark row failed
        if: failure() || cancelled()
        env:
          KIND: ${{ inputs.kind }}
          PROJECT_ID: ${{ inputs.project_id }}
          EPISODE_ID: ${{ inputs.episode_id }}
          PREVIOUS: ${{ inputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npx tsx scripts/recap-job.ts fail "$KIND" "$PROJECT_ID" "$EPISODE_ID" "$PREVIOUS" "The GitHub Actions run stopped: $RUN_URL"
